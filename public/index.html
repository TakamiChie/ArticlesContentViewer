<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>おんぷ村｜コンテンツビューアー</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header><div><span class="eyebrow">ONPU • CONTENT ARCHIVE</span><h1>コンテンツを、活動につなぐ。</h1><p>聴く、読み返す、共通する想いを見つける。</p></div><button id="settingsOpen">LLM接続設定</button></header>
  <main>
    <section class="filters" aria-label="絞り込み">
      <label class="search">コンテンツを検索<input id="query" type="search" placeholder="例：地域 プログラミング（空白区切りでAND検索）"></label>
      <label>検索対象<select id="field"><option value="all">タイトル・LLM概要・タグ</option value="title">タイトル</option><option value="llm_summary">LLM概要</option><option value="llm_tags">LLMタグ</option></select></label>
      <label>配信元<select id="source"><option value="">すべて</option></select></label>
      <label>種類<select id="type"><option value="">すべて</option></select></label>
      <label>並び順<select id="sort"><option value="new">新しい順</option><option value="old">古い順</option><option value="title">タイトル順</option></select></label>
    </section>
    <p id="status" role="status"></p>
    <div class="toolbar"><strong id="count">読み込み中…</strong><div><button id="pageSelect">このページを選択</button> <button id="refresh">更新</button></div></div>
    <div class="workspace"><section aria-label="コンテンツ一覧"><div id="list"></div><nav class="pagination" aria-label="ページ切り替え"><button id="prev">前へ</button><span id="page"></span><button id="next">次へ</button></nav></section>
      <aside><span class="eyebrow">COLLECTION</span><h2>選んだコンテンツ</h2><p id="selectedCount">0件選択</p><div id="selected"></div><button id="clear">選択を解除</button><button id="exportLinks">リンク一覧を保存</button><hr><label>まとめる視点<textarea id="instruction" rows="5" placeholder="例：地域でITを活用する活動の紹介文を作りたい。共通する目的と具体的な実践を整理してください。"></textarea></label><button id="summarize" class="primary" disabled>選択した内容をまとめる</button><button id="cancel" hidden>生成を中止</button><p class="hint">2〜100件を選択。概要とタグをローカルLLMに渡します。</p></aside>
    </div>
    <section id="resultPanel" hidden><div class="toolbar"><h2>活動につなげるまとめ</h2><button id="saveResult">Markdownで保存</button></div><p id="generationStatus" role="status"></p><article id="result" class="markdown-body"></article><ul id="references"></ul></section>
  </main>
  <dialog id="detail"><div class="toolbar"><span class="eyebrow">CONTENT DETAIL</span><button id="detailClose">閉じる</button></div><div id="detailBody"></div></dialog>
  <dialog id="settings"><h2>ローカルLLMの接続</h2><p>LM StudioなどのOpenAI互換APIに接続します。</p><label>APIベースURL<input id="baseUrl" value="http://127.0.0.1:1234/v1"></label><label>APIキー（必要な場合のみ・保存されません）<input id="apiKey" type="password" autocomplete="off"></label><button id="models">モデル一覧を取得</button><label>モデルID<input id="model" list="modelList" placeholder="取得したモデルを選択、またはIDを入力"></label><datalist id="modelList"></datalist><p id="modelStatus" role="status"></p><div class="toolbar"><button id="settingsClose">閉じる</button><button id="settingsSave" class="primary">設定を保存</button></div></dialog>
</body>
</html>
